plugins:
  - rubocop-performance
  - rubocop-rspec
  - rubocop-rake

AllCops:
  TargetRubyVersion: 3.2
  NewCops: enable
  Exclude:
    - 'bin/**/*'
    - 'examples/**/*'
    - 'vendor/**/*'
    - '**/node_modules/**/*'
    - 'tmp/**/*'

Style/Documentation:
  Enabled: false

Style/FrozenStringLiteralComment:
  Enabled: true
  EnforcedStyle: always

Metrics/MethodLength:
  Max: 50
  Exclude:
    - 'spec/**/*'

Metrics/ClassLength:
  Max: 200

Metrics/ModuleLength:
  Max: 200

Metrics/BlockLength:
  Enabled: false

Layout/LineLength:
  Max: 120

Style/StringLiterals:
  EnforcedStyle: single_quotes

Style/HashSyntax:
  EnforcedStyle: ruby19

# The two heuristic tools (cookie banners, captcha) are selector-heavy by
# nature; every other file is held to the normal limits.
Metrics/AbcSize:
  Max: 40
  Exclude:
    - 'lib/ferrum_mcp/tools/accept_cookies_tool.rb'
    - 'lib/ferrum_mcp/tools/solve_captcha_tool.rb'

Metrics/CyclomaticComplexity:
  Max: 10
  Exclude:
    - 'lib/ferrum_mcp/tools/accept_cookies_tool.rb'
    - 'lib/ferrum_mcp/tools/solve_captcha_tool.rb'

Metrics/PerceivedComplexity:
  Max: 10
  Exclude:
    - 'lib/ferrum_mcp/tools/accept_cookies_tool.rb'
    - 'lib/ferrum_mcp/tools/solve_captcha_tool.rb'

# RSpec configuration
RSpec/MultipleMemoizedHelpers:
  Max: 10

RSpec/DescribeClass:
  Enabled: false

RSpec/ExampleLength:
  Enabled: false

RSpec/MultipleExpectations:
  Max: 5
