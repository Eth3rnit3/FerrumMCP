name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

jobs:
  rubocop:
    name: RuboCop
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Run RuboCop
        run: bundle exec rubocop --parallel --format github

  zeitwerk:
    name: Zeitwerk Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libvips-dev libvips-tools

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Check Zeitwerk eager loading
        run: |
          RACK_ENV=production bundle exec ruby -r ./lib/ferrum_mcp -e "
          puts '✅ Zeitwerk eager loading successful!'
          puts 'Loaded classes: ' + FerrumMCP::Tools.constants.length.to_s
          "
        env:
          BROWSER_HEADLESS: "true"

  test:
    name: RSpec Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ruby-version: ['3.2', '3.3']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby ${{ matrix.ruby-version }}
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libvips-dev libvips-tools

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Verify Chrome installation and setup display
        run: |
          # Find Chrome
          CHROME_PATH=$(which google-chrome-stable || which google-chrome || which chromium-browser || echo "not found")
          echo "Chrome path: $CHROME_PATH"

          # Show version
          if [ "$CHROME_PATH" != "not found" ]; then
            $CHROME_PATH --version
          fi

          # Setup virtual display for headless
          export DISPLAY=:99
          sudo Xvfb -ac :99 -screen 0 1280x1024x24 > /dev/null 2>&1 &

      - name: Run RSpec tests
        env:
          RACK_ENV: test
          CI: true
          BROWSER_HEADLESS: true
          DISPLAY: ':99'
        run: |
          # Find Chrome binary
          export BROWSER_PATH=$(which google-chrome-stable || which google-chrome || which chromium-browser)
          echo "Using Chrome at: $BROWSER_PATH"

          # Run tests
          bin/test --format progress --format RspecJunitFormatter --out tmp/rspec-results.xml

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rspec-results-${{ matrix.ruby-version }}
          path: tmp/rspec-results.xml
          retention-days: 7

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: matrix.ruby-version == '3.3'
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  docker:
    name: Docker Image (build + smoke test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Same file and cache scope as docker-publish.yml, but never pushed
      - name: Build standard image (amd64)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: ferrum-mcp:ci
          cache-from: type=gha,scope=standard-amd64

      - name: Smoke test HTTP transport
        run: |
          docker run -d --name ferrum-ci -p 3000:3000 --security-opt seccomp=unconfined ferrum-mcp:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/health; then break; fi
            sleep 1
          done
          curl -fsS http://localhost:3000/health | grep -q '"ok"'
          curl -fsS http://localhost:3000/ | grep -q "$(ruby -r ./lib/ferrum_mcp/version -e 'print FerrumMCP::VERSION')"

      - name: Smoke test STDIO transport with a real browser session
        run: |
          ruby .github/scripts/mcp_smoke_test.rb \
            docker run --rm -i --security-opt seccomp=unconfined -e LOG_FILE=stderr ferrum-mcp:ci \
            bin/ferrum-mcp start --transport stdio

      - name: Container logs
        if: always()
        run: docker logs ferrum-ci 2>&1 | tail -50 || true

  docker-botbrowser:
    name: Docker BotBrowser Image (build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build BotBrowser image (amd64)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.with-botbrowser
          secrets: |
            github_token=${{ secrets.GITHUB_TOKEN }}
          platforms: linux/amd64
          push: false
          load: true
          tags: ferrum-mcp:ci-botbrowser
          cache-from: type=gha,scope=botbrowser-amd64

      - name: Smoke test HTTP transport
        run: |
          docker run -d --name ferrum-bb -p 3000:3000 --security-opt seccomp=unconfined ferrum-mcp:ci-botbrowser
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/health; then break; fi
            sleep 1
          done
          curl -fsS http://localhost:3000/health | grep -q '"ok"'
          docker exec ferrum-bb test -x /opt/botbrowser/chrome
          docker exec ferrum-bb /opt/botbrowser/chrome --version || true

      - name: Container logs
        if: always()
        run: docker logs ferrum-bb 2>&1 | tail -50 || true

  all-checks:
    name: All Checks Passed
    runs-on: ubuntu-latest
    needs: [rubocop, zeitwerk, test, docker, docker-botbrowser]
    if: always()
    steps:
      - name: Check all jobs
        run: |
          if [[ "${{ needs.rubocop.result }}" == "success" && \
                "${{ needs.zeitwerk.result }}" == "success" && \
                "${{ needs.test.result }}" == "success" && \
                "${{ needs.docker.result }}" == "success" && \
                "${{ needs.docker-botbrowser.result }}" == "success" ]]; then
            echo "✅ All checks passed!"
            exit 0
          else
            echo "❌ Some checks failed:"
            echo "  RuboCop: ${{ needs.rubocop.result }}"
            echo "  Zeitwerk: ${{ needs.zeitwerk.result }}"
            echo "  Tests: ${{ needs.test.result }}"
            echo "  Docker: ${{ needs.docker.result }}"
            echo "  Docker BotBrowser: ${{ needs.docker-botbrowser.result }}"
            exit 1
          fi
