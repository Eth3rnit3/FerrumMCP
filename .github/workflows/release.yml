name: Release

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build Gem
    runs-on: ubuntu-latest
    outputs:
      gem_name: ${{ steps.build.outputs.gem_name }}
      version: ${{ steps.build.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Check release tag matches gem version
        run: |
          VERSION=$(ruby -r ./lib/ferrum_mcp/version -e 'print FerrumMCP::VERSION')
          TAG="${{ github.event.release.tag_name }}"
          echo "Gem version: $VERSION, release tag: $TAG"
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::Release tag $TAG does not match lib/ferrum_mcp/version.rb (v$VERSION)"
            exit 1
          fi

      - name: Build gem
        id: build
        run: |
          gem build ferrum-mcp.gemspec
          GEM_NAME=$(ls *.gem)
          VERSION=$(echo $GEM_NAME | sed 's/ferrum-mcp-\(.*\)\.gem/\1/')
          echo "gem_name=$GEM_NAME" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Built: $GEM_NAME (version: $VERSION)"

      - name: Upload gem artifact
        uses: actions/upload-artifact@v4
        with:
          name: gem
          path: "*.gem"
          retention-days: 1

  publish-rubygems:
    name: Publish to RubyGems
    needs: build
    runs-on: ubuntu-latest
    # Trusted publishing: rubygems.org exchanges this job's OIDC token for a
    # short-lived API key. No RUBYGEMS_API_KEY secret, no MFA prompt.
    # The trusted publisher on rubygems.org must point at this repository and
    # at the workflow file release.yml.
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download gem artifact
        uses: actions/download-artifact@v4
        with:
          name: gem

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Skip if this version is already on RubyGems
        id: exists
        run: |
          VERSION="${{ needs.build.outputs.version }}"
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' \
            "https://rubygems.org/api/v2/rubygems/ferrum-mcp/versions/$VERSION.json")
          if [ "$STATUS" = "200" ]; then
            echo "ferrum-mcp $VERSION is already published, skipping push"
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure RubyGems credentials (OIDC trusted publishing)
        if: steps.exists.outputs.published != 'true'
        uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0

      - name: Publish to RubyGems
        if: steps.exists.outputs.published != 'true'
        run: gem push "${{ needs.build.outputs.gem_name }}"

  publish-github:
    name: Publish to GitHub Packages
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download gem artifact
        uses: actions/download-artifact@v4
        with:
          name: gem

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Configure GitHub Packages
        run: |
          mkdir -p ~/.gem
          cat << EOF > ~/.gem/credentials
          ---
          :github: Bearer ${{ secrets.GITHUB_TOKEN }}
          EOF
          chmod 0600 ~/.gem/credentials

      - name: Publish to GitHub Packages
        run: |
          gem push --key github --host https://rubygems.pkg.github.com/Eth3rnit3 ${{ needs.build.outputs.gem_name }}

      - name: Cleanup credentials
        if: always()
        run: rm -f ~/.gem/credentials
