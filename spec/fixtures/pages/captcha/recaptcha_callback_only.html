<!DOCTYPE html>
<html>
<head><title>reCAPTCHA Enterprise, callback integration</title></head>
<body>
  <!-- The widget's anchor frame, as reCAPTCHA renders it -->
  <div class="g-recaptcha">
    <iframe name="a-abc123" title="reCAPTCHA" src="about:blank" width="304" height="78"></iframe>
  </div>
  <!-- No textarea[name=g-recaptcha-response]: the site reads the token through the JS API -->
  <script>
    window.grecaptcha = {
      enterprise: {
        getResponse: () => 'enterprise-token-' + 'x'.repeat(40)
      }
    };
  </script>
</body>
</html>
