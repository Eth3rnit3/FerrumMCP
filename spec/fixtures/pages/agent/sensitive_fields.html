<!DOCTYPE html>
<html lang="en">
<head><title>Sensitive fields</title></head>
<body>
  <label for="username">Username</label>
  <input id="username" type="text" value="visible-username">
  <label for="password">Password</label>
  <input id="password" type="password" value="dummy-password-secret">
  <input id="password-as-button" type="password" role="button" value="dummy-password-secret">
  <input id="password-as-radio" type="password" role="radio" value="dummy-password-secret">
</body>
</html>
